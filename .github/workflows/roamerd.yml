name: roamerd

on:
  pull_request:
  push:
    branches:
      - master
      - heartbeat/named-point-navigation

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff format
        run: ruff format --check src/roamerd tests/roamerd src/roamer/cli/main.py

      - name: Ruff lint
        run: ruff check src/roamerd tests/roamerd src/roamer/cli/main.py

      - name: Mypy strict
        run: mypy src/roamerd --strict

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: Pytest
        run: pytest -m "not hardware"
