name: roamerd

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - refactor/worktree

jobs:
  gates:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check src/roamerd tests/roamerd sitecustomize.py readline.py ros2_ws/src/roamer_ros/roamer_ros

      - name: Lint
        run: ruff check src/roamerd tests/roamerd sitecustomize.py readline.py ros2_ws/src/roamer_ros/roamer_ros

      - name: Typecheck
        run: mypy --strict

      - name: Check Pi preflight shell syntax
        run: |
          bash -n scripts/roamerd-pi-preflight.sh
          bash -n scripts/roamerd-pi-collect-phase-e-facts.sh
          bash -n scripts/roamerd-pi-phase-e-acceptance.sh
          bash -n scripts/roamerd-pi-ubuntu24-bootstrap.sh

      - name: Test
        run: python -m pytest -m "not hardware" -q
