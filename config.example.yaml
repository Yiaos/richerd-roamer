# Roamer Configuration Example

drivers:
  camera: fswebcam
  audio: alsa
  tts: edge
  asr: funasr
  vad: silero
  motion: valetudo
  bluetooth: bluez

# Bluetooth speaker auto-connect
bluetooth:
  speaker_mac: "B8:5C:EE:89:00:BE"  # Auto-connect before playback

# Driver-specific settings
fswebcam:
  device: /dev/video0
  width: 1280
  height: 720

alsa:
  capture_device: "hw:2,0"
  playback_device: "default"
  sample_rate: 16000
  channels: 2

piper:
  binary: ~/bin/piper/piper
  model: ~/models/piper/zh_CN-huayan-medium.onnx

edge:
  voice: zh-CN-YunxiNeural
  rate: "+0%"
  volume: "+0%"

silero:
  model: ~/models/silero-vad/silero_vad.onnx
  threshold: 0.5

funasr:
  model: paraformer-zh-streaming

valetudo:
  host: 10.0.0.100
  port: 80
