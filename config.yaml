# Roamer Configuration Example

drivers:
  camera: fswebcam
  audio: alsa
  tts: edge
  asr: funasr
  vad: silero
  motion: valetudo
  bluetooth: bluez

# Startup initialization owned by Roamer itself
init:
  connect_speaker_on_startup: true
  configure_proxy_on_startup: true
  ensure_serve_on_startup: true
  serve_start_timeout_sec: 10.0
  proxy_init_timeout_sec: 20.0
  bluetooth_controller_ready_timeout_sec: 20.0
  bluetooth_connect_retry_timeout_sec: 20.0
  bluetooth_retry_interval_sec: 1.0

# Bluetooth speaker config
bluetooth:
  speaker_mac: "B8:5C:EE:89:00:BE"  # Used by startup init + lazy reconnect before playback

# Driver-specific settings
fswebcam:
  device: /dev/video0
  width: 1280
  height: 720

alsa:
  capture_device: "hw:0,0"
  playback_device: "default"
  sample_rate: 16000
  channels: 2

piper:
  binary: ~/bin/piper/piper
  model: ~/models/piper/zh_CN-huayan-medium.onnx

edge:
  voice: zh-CN-YunxiNeural
  rate: "+0%"
  volume: "+0%"

silero:
  model: ~/models/silero-vad/silero_vad.onnx
  threshold: 0.1

funasr:
  model: paraformer-zh-streaming
  disable_update: true

serve:
  enabled: true
  socket: /run/roamer/roamer.sock
  request_timeout_sec: 60.0
  fallback_to_cli: true
  prewarm:
    asr: true
    vad: true
    tts: false

valetudo:
  host: 10.0.0.226
  port: 80
  timeout_sec: 8.0

motion:
  wait_timeout_sec: 300
  poll_interval_sec: 2
  arrival_tolerance: 150
  named_points:
    阳台:
      x: 2082
      y: 2377
      angle: 111
    米多和阿良的房间:
      x: 2540
      y: 2565
      angle: 266

# Converse (voice wake + dialog loop)
converse:
  enabled: true
  silence_timeout: 2.5
  max_turns: 1
  no_sound_default: false

  wakeword:
    enabled: false
    driver: openwakeword
    model: ""
    threshold: 0.5
    prompt_sound: false

  # Minimal v1 intent whitelist seed
  intents:
    - name: time_now
      action: time.now
      patterns: ["现在几点", "几点了"]
    - name: status
      action: sense
      patterns: ["你在哪", "状态"]
    - name: watch
      action: watch
      patterns: ["看一下", "拍张照"]
    - name: go_home
      action: motion.home
      patterns: ["回家", "回充电"]
    - name: position
      action: motion.position
      patterns: ["你在哪个位置", "当前位置"]

  endpoint:
    mode: fixed_recording
    silence_sec: 2.0
    min_speech_sec: 0.2
    max_record_sec: 10.0
    pre_speech_padding_sec: 0.3

  discord:
    enabled: true
    channel_id: "1478341934324908084"
    token_env: DISCORD_BOT_TOKEN
    source: roamer
    mention_user_id: "1477701379437891695"
    mention_role_id: ""
    mention: ""
    reply_instruction: "回复给用户时，请让 Roamer 播报给用户。"
