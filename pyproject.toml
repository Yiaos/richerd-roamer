[project]
name = "roamer"
version = "0.1.0"
description = "Roamer - Richerd's physical body CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
speech = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "funasr>=1.0",
    "onnxruntime>=1.15",
    "websockets>=12.0",
]
gpio = ["gpiod>=2.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1", "mypy>=1.8", "websockets>=12.0"]

[project.scripts]
roamer = "roamer.cli.main:main"
roamerd = "roamerd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roamer", "src/roamerd"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
files = ["src/roamerd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: requires physical hardware"]
pythonpath = ["src"]
